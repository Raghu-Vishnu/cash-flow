# Publishes Cash Flow to GitHub Pages on every push to main.
# config.js is generated here from the repository variable GOOGLE_CLIENT_ID
# (Settings → Secrets and variables → Actions), so the value is never in the source code.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate config.js from repository settings
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID || secrets.GOOGLE_CLIENT_ID }}
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS || vars.ADMIN_EMAILS }}
        run: python3 scripts/make-config.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
